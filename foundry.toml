[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
    "forge-std/=lib/forge-std/src/",
    "contracts/=contracts/",
    "contracts/settlement/=contracts/settlement/",
    "contracts/disputes/=contracts/disputes/",
    "contracts/governance/=contracts/governance/",
    "contracts/upgrade/=contracts/upgrade/",
    "contracts/libraries/=contracts/libraries/",
    "contracts/interfaces/=contracts/interfaces/",
    "contracts/mocks/=contracts/mocks/",
    "contracts-vrm/=contracts-vrm/",
]

[profile.default.model_checker]
contracts = {
    "contracts/WeightedStaking.sol" = [ "WeightedStaking" ],
    "contracts/staking.sol" = [ "Staking" ],
    "contracts/TruthBounty.sol" = [ "TruthBounty" ],
    "contracts/governance/EmergencyController.sol" = [ "EmergencyController" ],
    "contracts/upgrade/ProtocolUpgradeManager.sol" = [ "ProtocolUpgradeManager" ]
}
engine = "chc"
timeout = 10000
targets = [ "assert" ]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[invariant]
runs = 500
depth = 20
fail_on_revert = false

[profile.default.fuzz]
runs = 1000
depth = 256

[profile.default.invariant]
runs = 500
depth = 20
fail_on_revert = false
