[profile.default]
src = "test"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
fs_permissions = [{ access = "read", path = "./" }]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
    "forge-std/=lib/forge-std/src/",
    "../../contracts/=contracts/",
    "../contracts/=contracts/",
]

fs_permissions = [{ access = "read", path = "./deployments" }]

[profile.default.model_checker]
contracts = { "contracts/WeightedStaking.sol" = [ "WeightedStaking" ], "contracts/staking.sol" = [ "Staking" ] }
engine = "chc"
timeout = 10000
targets = [ "assert" ]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"


[invariant]
runs = 500
depth = 20
fail_on_revert = false

[coverage]
# Coverage quality gates - enforce minimum thresholds to prevent superficial tests
# from satisfying critical-path requirements
line_threshold = 85
branch_threshold = 80
function_threshold = 90

# Exclude mocks, tests, and generated files from coverage
skip = [
    "test/**",
    "script/**",
    "contracts/mocks/**",
    "contracts/test/**",
    "contracts/bootstrap/**",
    "contracts/upgrade/**",
    "contracts/performance/**",
    "lib/**",
    "@openzeppelin/**",
]

# Report format
reports = ["lcov", "summary", "json"]